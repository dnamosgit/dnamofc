<footer class="site-footer">
  <div class="w foot">
    <!-- Footer row 1: page links on the left, light / dark switch on the right -->
    <div class="foot-top">
      <nav class="foot-links" aria-label="Footer">{{footLinks}}</nav>
      <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Light / dark mode"><span class="tt-track" aria-hidden="true"><span class="tt-knob"><svg class="tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="tt-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></span></button>
    </div>
    <!-- Footer row 2: legal line on the left, copyright on the right -->
    <div class="foot-base">
      <p class="legal">{{legal}}</p>
      <span>{{copyright}}</span>
    </div>
<!-- Social icons: float at the right edge on tablet and desktop, sit here in the footer on phones. -->
<div class="soc">
  <a href="{{linkedin}}" aria-label="Dnamo on LinkedIn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></a>
  <a href="{{instagram}}" aria-label="Dnamo on Instagram"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg></a>
</div>
  </div>
</footer>
