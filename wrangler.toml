# Cloudflare Pages project for dnamofc.com: the public Dnamo FC website.
#
# It has no admin of its own. The admin center lives in the Dnamo Foundation project and
# saves to the shared database below; this project reads it and shows what was saved.
# The database tables are owned by the Foundation project's migrations, so this
# project has none.
name = "dnamofc"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# The shared database (an identifier, not a secret): the same one the admin saves to.
[[d1_databases]]
binding = "DB"
database_name = "dnamo-admin"
database_id = "c6520aff-756d-447f-b9f2-f34aa0c5e778"
