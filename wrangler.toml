# Cloudflare Pages project for dnamofc.com: the public site, the admin center and its database.
name = "dnamofc"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

# Database for admin accounts, sessions and editable site content.
# Created with `npx wrangler d1 create dnamofc-admin`; the id below is an identifier, not a secret.
[[d1_databases]]
binding = "DB"
database_name = "dnamofc-admin"
database_id = "3a69ba58-7a7e-4d4d-94d5-c4267879ad56"
migrations_dir = "migrations"
